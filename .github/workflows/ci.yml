# Одна ветка — master: Linux перестал быть отдельной линией после релиза 1.2.5.
# Not in CI: tauri build, NSIS/AppImage, подпись релиза.
#
# Джобы разделены по тому, что именно проверяют, а не по платформам «на всякий случай».
# Раньше Windows и Linux делали одну и ту же работу целиком, и прогон занимал 17 минут при
# минуте полезной. Что изменилось и почему — в комментариях у каждой джобы.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Инкрементальная сборка в CI — чистый вред: артефакты огромные, кэш от них пухнет, а
  # выигрыша нет, потому что каждый прогон начинается с чистого каталога.
  CARGO_INCREMENTAL: 0
  # Отладочная информация в CI никому не нужна, а на Windows её генерация и линковка —
  # заметная часть времени сборки. Сообщения паник от этого не страдают.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Фронтенд не зависит от платформы, поэтому проверяется один раз на самом быстром
  # раннере. Раньше `tsc` и `npm audit` гонялись ещё и на Windows — впустую.
  frontend:
    name: фронтенд (tsc, npm audit)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: tsc
        run: npm run typecheck

      # Прод-зависимости — блокирующе: то, что уезжает пользователю, обязано быть чистым.
      - name: npm audit (прод)
        run: npm audit --omit=dev --audit-level=high

      # Сборочные — отдельно и без падения. Уязвимость в dev-сервере vite не попадает в
      # артефакт, и ронять из-за неё чужой pull request незачем; видеть её всё равно надо.
      - name: npm audit (сборочные, справочно)
        continue-on-error: true
        run: npm audit --audit-level=high

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Системные библиотеки Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev

      # Версия задана явно и совпадает с `rust-toolchain.toml`. С `@stable` действие ставило
      # одну версию, а rustup по файлу подтягивал другую — ключ кэша при этом плыл, и кэш
      # попадал лишь частично («full match: false»), то есть почти всё пересобиралось заново.
      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Общий ключ со стендом: обе джобы собирают тот же крейт теми же зависимостями,
          # и держать для них два разных кэша значит греть каждый по отдельности.
          shared-key: serein-rust
          cache-all-crates: true

      # Только `cargo test`, без отдельного `cargo check`.
      #
      # Это была половина времени прогона: `check` компилирует всё дерево ради проверки, а
      # следом `test` компилирует его же заново под тестовый профиль. Ошибку компиляции
      # `cargo test` ловит ничуть не хуже — просто на шаг позже.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

  # Матрица авторизации против настоящих SSH-серверов в Docker. Отдельной джобой, потому
  # что это единственная часть CI, которой нужен Docker, и падать она должна отдельно от
  # быстрых проверок — по красному крестику сразу видно, сеть это или компиляция.
  ssh-stand:
    name: SSH-стенд (интеграция)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Системные библиотеки Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: serein-rust
          cache-all-crates: true

      # Сначала собираем тесты, потом поднимаем стенд: сборка идёт минуты, стенд — секунды,
      # и в таком порядке контейнеры живут ровно столько, сколько нужно. Фокусов с запуском
      # в фоне не делаем: экономия там минута, а способов тихо разъехаться — несколько.
      - name: Собрать тесты
        run: cargo test --manifest-path src-tauri/Cargo.toml --test ssh_stand --test sftp_stand --locked --no-run

      - name: Поднять стенд
        run: bash ./scripts/ssh-stand/up.sh

      # Профиль уводим во временный каталог: тесты подтверждают ключи хостов, то есть
      # пишут в профиль, и делать это в домашнем каталоге раннера незачем.
      - name: Прогнать матрицу
        env:
          SEREIN_CONFIG_DIR: ${{ runner.temp }}/serein-profile
          SEREIN_STAND_HOST: 127.0.0.1
          SEREIN_STAND_DEBIAN_PORT: "2201"
          SEREIN_STAND_ALPINE_PORT: "2202"
          SEREIN_STAND_ALPINE_INTERNAL: alpine
          SEREIN_STAND_HOSTKEY_PORT: "2203"
          SEREIN_STAND_USER: probe
          SEREIN_STAND_PASSWORD: probe-pass
        run: |
          export SEREIN_STAND_KEY="$GITHUB_WORKSPACE/scripts/ssh-stand/.stand/id_ed25519"
          cargo test --manifest-path src-tauri/Cargo.toml --test ssh_stand --locked -- --ignored
          cargo test --manifest-path src-tauri/Cargo.toml --test sftp_stand --locked -- --ignored

      - name: Логи стенда при падении
        if: failure()
        run: docker compose -f scripts/ssh-stand/docker-compose.yml logs

      - name: Погасить стенд
        if: always()
        run: bash ./scripts/ssh-stand/down.sh

  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Единственная часть проверки, которая устаревает сама по себе: база уязвимостей
      # пополняется, даже когда в коде ничего не меняется. Поэтому отдельной джобой,
      # а не шагом внутри сборки.
      #
      # Ставим сам cargo-audit, а не готовое действие: тому нужны права на запись
      # в issues и checks, а нам достаточно упасть с ненулевым кодом.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Одно исключение, и оно вынужденное.
      #
      # RUSTSEC-2023-0071 (rsa, Marvin attack) исправления не имеет вовсе: апстрим его не
      # выпустил, в самой записи стоит «No fixed upgrade is available». Крейт приходит
      # транзитивно через russh и нужен для поддержки RSA-ключей — выключить его feature
      # можно, но тогда перестанут работать обычные `id_rsa`, которых в реальных
      # инфраструктурах большинство. Атака к тому же про тайминги RSA-расшифровки, а в SSH
      # RSA используется для подписи.
      #
      # RUSTSEC-2026-0153 и RUSTSEC-2026-0154 (russh, russh-cryptovec) закрыты переходом
      # на russh 0.63 — из списка убраны, а не спрятаны.
      #
      # Список именной: любая НОВАЯ уязвимость по-прежнему роняет сборку.
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071
