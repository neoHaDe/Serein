# Одна ветка — master: Linux перестал быть отдельной линией после релиза 1.2.5.
# Smoke на windows-latest и ubuntu-22.04, плюс проверка зависимостей на уязвимости.
# Not in CI: tauri build, NSIS/AppImage, live SSH.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke-windows:
    name: smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      - name: tsc
        run: npm run typecheck

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

  smoke-linux:
    name: smoke (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      - name: smoke
        run: npm run smoke:linux

  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Единственная часть проверки, которая устаревает сама по себе: база уязвимостей
      # пополняется, даже когда в коде ничего не меняется. Поэтому отдельной джобой,
      # а не шагом внутри сборки.
      #
      # Ставим сам cargo-audit, а не готовое действие: тому нужны права на запись
      # в issues и checks, а нам достаточно упасть с ненулевым кодом.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock
