# Windows release: smoke on windows-latest. Linux port: separate job on ubuntu-22.04.
# Not in CI: tauri build, NSIS/AppImage, live SSH.

name: CI

on:
  push:
    branches: [master, linux/port]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke-windows:
    name: smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      - name: tsc
        run: npm run typecheck

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

  smoke-linux:
    name: smoke (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      - name: smoke
        run: npm run smoke:linux