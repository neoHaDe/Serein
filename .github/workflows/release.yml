# Сборка NSIS + portable и публикация GitHub Release по тегу v*.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      # Подписанная сборка — только если в репозитории заведён секрет с приватным ключом.
      # Без него tauri видит pubkey в конфиге, требует ключ и падает с кодом 1,
      # хотя установщик при этом уже собран.
      - name: tauri build
        id: build
        run: npm run tauri -- build
        continue-on-error: true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Запасной путь: та же сборка, но без артефактов апдейтера — они и требуют подпись.
      - name: tauri build (without updater artifacts)
        if: steps.build.outcome == 'failure'
        run: npm run tauri -- build --config src-tauri/tauri.ci.conf.json

      - name: portable exe
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dir = "src-tauri/target/release/bundle/nsis"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "src-tauri/target/release/serein.exe" "$dir/Serein_${ver}_x64-portable.exe"

      - name: release notes path
        id: notes
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "path=docs/RELEASE_NOTES_v${ver}.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Serein ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-portable.exe
          fail_on_unmatched_files: true
