# Версия тулчейна закреплена, а не «какая стоит на машине».
#
# Без этого одна и та же метка в git собирается по-разному у меня, на сборочной VM и в CI:
# разные версии rustc дают разный бинарь. Для воспроизводимой сборки, обещанной в P0.3,
# это первое условие — и первое, о чём спрашивают при проверке цепочки поставки.
#
# Лежит в корне, а не в `src-tauri/`: rustup ищет файл в текущем каталоге и выше, а cargo
# в CI зовётся из корня через `--manifest-path`. В `src-tauri/` файл бы просто не заметили.
#
# Целевые платформы не перечисляем: каждый хост собирает под себя, а лишний target только
# замедлял бы установку.
#
# Обновлять осознанно и отдельным коммитом, а не заодно с чем-то ещё.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
