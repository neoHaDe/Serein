# Помощник RDP: отдельный исполняемый файл со своим деревом зависимостей.
#
# Своя `[workspace]` здесь не для порядка, а по необходимости. Крейты рабочей области
# делят один `Cargo.lock` и одно разрешение зависимостей, а IronRDP через `picky` прибивает
# знаком `=` шестнадцать крейтов RustCrypto к конкретным release candidate'ам - ровно те,
# которые SSH-ядро приложения использует в стабильных версиях. В одном дереве они не
# сходятся ни при каких условиях, и это единственная причина, по которой RDP живёт
# отдельным процессом, а не модулем.
[workspace]

[package]
name = "serein-rdp"
version = "1.3.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[dependencies]
# connector - рукопожатие с NLA и TLS, session - разбор кадров, graphics - декодеры.
# IronRDP берём из git, закреплённым за коммитом, а не с crates.io.
#
# В выпущенной 0.11.0 есть ошибка разбора: сервер шлёт битмап, ширина которого округлена
# вверх до кратности четырём (250 превращается в 252), декодер разжимает строки по этой
# ширине, а раскладывает их по ширине прямоугольника - и картинка едет на два пикселя в
# строке. Поймано живой проверкой против xrdp, подтверждено журналом самого IronRDP.
#
# В главной ветке это уже исправлено:  принимает ширину источника отдельным
# доводом. Ждать выпуска не стали - закрепились за коммитом, чтобы сборка оставалась
# воспроизводимой. Когда выйдет версия с этой правкой, здесь снова будет crates.io.
ironrdp = { git = "https://github.com/Devolutions/IronRDP", rev = "36912ba34a921b3cb7f3d8cf623564551da35b89", features = ["connector", "session", "graphics", "input", "svc", "dvc", "displaycontrol"] }
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP", rev = "36912ba34a921b3cb7f3d8cf623564551da35b89" }
ironrdp-async = { git = "https://github.com/Devolutions/IronRDP", rev = "36912ba34a921b3cb7f3d8cf623564551da35b89" }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP", rev = "36912ba34a921b3cb7f3d8cf623564551da35b89", features = ["native-tls"] }
# Ради `WriteBuf`: пересогласование после смены размера собирает ответ в него.
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "36912ba34a921b3cb7f3d8cf623564551da35b89" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
# Тот же TLS, что и в приложении: вторая реализация в поставке не нужна.
tokio-native-tls = "0.3"
native-tls = "0.2"
# Большие RGBA-области нельзя гонять через stdout → Tauri → WebView без сжатия:
# один кадр 1920x1080 занимает почти 8 МиБ. JPEG используется только между helper и
# интерфейсом; сам RDP-трафик по SSH сжимается штатным bulk compression.
jpeg-encoder = { version = "0.6", features = ["simd"] }
# Отпечаток открытого ключа сервера - чтобы смена ключа была хотя бы видна в журнале.
# Версии те же, что уже пришли через IronRDP: новых крейтов в дереве не появляется.
sha2 = "0.11"
base64 = "0.22"

[profile.release]
# Те же настройки, что у приложения: помощник едет в тот же пакет, и весить он должен
# столько же бережно.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
