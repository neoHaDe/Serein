[package]
name = "serein"
version = "1.2.4"
description = "Serein — desktop SSH/SFTP workstation"
authors = ["HaDe"]
license = "Apache-2.0"
edition = "2021"
default-run = "serein"

[lib]
name = "serein_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "phase0_bench"
path = "src/bin/phase0_bench.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
portable-pty = "0.8"
serialport = "4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"
byteorder = "1"
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
rand = "0.8"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption", "std", "getrandom"] }
open = "5"
dunce = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory"] }
winreg = "0.52"
webview2-com = "0.38"
windows-core = "0.61"
drag = "2.1"

# Иначе AES/SSH в `tauri dev` ~10 МБ/с. Свои крейты остаются без оптимизации.
[profile.dev.package."*"]
opt-level = 3
