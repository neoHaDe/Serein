[package]
name = "serein"
version = "1.2.6"
description = "Serein — desktop SSH/SFTP workstation"
authors = ["HaDe"]
license = "Apache-2.0"
edition = "2021"
default-run = "serein"

[lib]
name = "serein_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "phase0_bench"
path = "src/bin/phase0_bench.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Криптобэкенд — ring, а не aws-lc-rs (умолчание russh): последний собирается через
# aws-lc-sys, которому нужны C-тулчейн, cmake и NASM. Это сломало бы сборку на Windows,
# на VM и в CI, и убило бы воспроизводимость сборки, обещанную в P0.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa", "des"] }
# russh-keys влит в сам russh начиная с 0.50 — теперь это `russh::keys`.
russh-sftp = "2"
portable-pty = "0.8"
serialport = "4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"
byteorder = "1"
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
hex = "0.4"
md5 = "0.7"
sha1 = "0.10"
native-tls = "0.2"
x509-parser = "0.16"
rand = "0.8"
# ssh-key отдельной строкой не нужен: используем реэкспорт `russh::keys::ssh_key`.
open = "5"
# Уже в дереве через aes-gcm и ssh-key — новой поверхности не добавляет.
zeroize = "1"
dunce = "1"

[target.'cfg(not(windows))'.dependencies]
# Буфер обмена вне Windows: на Windows работаем напрямую через Win32, там arboard лишний.
arboard = "3.4"

[target.'cfg(unix)'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory"] }
winreg = "0.52"
webview2-com = "0.38"
windows-core = "0.61"
drag = "2.1"

# Иначе AES/SSH в `tauri dev` ~10 МБ/с. Свои крейты остаются без оптимизации.
[profile.dev.package."*"]
opt-level = 3
