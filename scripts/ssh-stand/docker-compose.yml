# Стенд из настоящих SSH-серверов для интеграционных тестов.
#
# Зачем два образа, а не один: Debian даёт обычный OpenSSH, Alpine - BusyBox-окружение,
# где нет половины привычных утилит. Ровно на таких машинах (роутеры, встраиваемые
# системы) и ломаются вещи, которые на Debian работают.
#
# Порты высокие и нестандартные, чтобы не столкнуться с настоящим sshd на хосте.
name: serein-ssh-stand

services:
  debian:
    build:
      context: .
      dockerfile: Dockerfile.debian
    ports:
      - "127.0.0.1:2201:22"
      # Второй порт на ту же машину - для теста, который портит запомненный отпечаток.
      # Отдельный порт = отдельная запись в known_hosts, и тест не мешает соседям,
      # которые в это же время ходят на 2201.
      - "127.0.0.1:2203:22"
    # Ключи хоста генерируются при старте контейнера: тесты проверяют в том числе
    # поведение при первой встрече с незнакомым ключом, и для этого он должен быть новым.
    volumes:
      - ./.stand/authorized_keys:/keys/authorized_keys:ro

  # Сервер без подсистемы SFTP: проверяет запасной путь через SCP + ls.
  nosftp:
    build:
      context: .
      dockerfile: Dockerfile.nosftp
    ports:
      - "127.0.0.1:2204:22"
    volumes:
      - ./.stand/authorized_keys:/keys/authorized_keys:ro

  # Рабочий стол VNC на петле контейнера: наружу порт 5900 НЕ публикуется намеренно -
  # дойти до него можно только каналом внутри SSH-сессии, как и задумано в приложении.
  vnc:
    build:
      context: .
      dockerfile: Dockerfile.vnc
    ports:
      - "127.0.0.1:2205:22"
    volumes:
      - ./.stand/authorized_keys:/keys/authorized_keys:ro

  # Базы данных живут рядом с сервером и слушают только его сеть - наружу порты не
  # публикуются намеренно. Дойти до них можно лишь каналом внутри SSH-сессии, что и
  # проверяется тестами: обычный клиент здесь бессилен, и это правильная постановка задачи.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: probe-pass
      POSTGRES_USER: probe
      POSTGRES_DB: probe

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "probe-pass"]

  # Веб-служба для проверки HTTP-утилиты. Порт наружу не публикуется - как и у баз:
  # смысл проверки «с сервера» именно в том, что снаружи этого адреса не существует.
  web:
    image: nginx:alpine
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Каталог LDAP. Образ из quay.io, а не с Docker Hub: последний с домашнего сервера
  # недоступен вовсе. 389 Directory Server - тот же, что лежит в основе Red Hat Directory
  # Server, то есть ровно та реализация, с которой имеют дело в организациях.
  ldap:
    image: quay.io/389ds/dirsrv:latest
    # Порт наружу публикуется, в отличие от баз, и это не непоследовательность. Базы мы
    # открываем каналом внутри SSH - тем и ценны. А клиент каталога открывает сокет сам,
    # запрос идёт с машины пользователя, и проверять его надо ровно так же.
    # Снаружи 13389, а не 3389: последний на Windows занят системой под RDP и не
    # отдаётся даже петле. Внутри контейнера порт остаётся своим.
    ports:
      - "127.0.0.1:13389:3389"
    environment:
      DS_DM_PASSWORD: probe-pass
      DS_SUFFIX_NAME: dc=probe,dc=local
    # Проверяем тем же, чем каталог и пользуются: анонимным запросом корневой записи.
    # Это заодно доказывает, что он не просто запустился, а отвечает на LDAP.
    # Порт 3389, а не 389: контейнер работает не от root и низкие порты занять не может.
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -H ldap://localhost:3389 -x -s base -b '' vendorVersion >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Две разные MySQL-совместимые базы, потому что различаются они не диалектом, а входом:
  # MariaDB по умолчанию проверяет пароль плагином mysql_native_password, MySQL 8 -
  # caching_sha2_password с обменом открытым ключом. Наш клиент обязан пройти оба, и на
  # одном образе это не проверить.
  #
  # Проверка готовности здесь не украшение: обе базы открывают порт задолго до того, как
  # готовы отвечать, а MySQL 8 при первом запуске ещё десятки секунд создаёт системные
  # таблицы. Без ожидания тест падал бы через раз и выглядел как плавающая ошибка клиента.
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: probe-pass
      MARIADB_DATABASE: probe
      MARIADB_USER: probe
      MARIADB_PASSWORD: probe-pass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: probe-pass
      MYSQL_DATABASE: probe
      MYSQL_USER: probe
      MYSQL_PASSWORD: probe-pass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  alpine:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    ports:
      - "127.0.0.1:2202:22"
    volumes:
      - ./.stand/authorized_keys:/keys/authorized_keys:ro
