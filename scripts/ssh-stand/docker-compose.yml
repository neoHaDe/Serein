# Стенд из настоящих SSH-серверов для интеграционных тестов.
#
# Зачем два образа, а не один: Debian даёт обычный OpenSSH, Alpine — BusyBox-окружение,
# где нет половины привычных утилит. Ровно на таких машинах (роутеры, встраиваемые
# системы) и ломаются вещи, которые на Debian работают.
#
# Порты высокие и нестандартные, чтобы не столкнуться с настоящим sshd на хосте.
name: serein-ssh-stand

services:
  debian:
    build:
      context: .
      dockerfile: Dockerfile.debian
    ports:
      - "127.0.0.1:2201:22"
      # Второй порт на ту же машину — для теста, который портит запомненный отпечаток.
      # Отдельный порт = отдельная запись в known_hosts, и тест не мешает соседям,
      # которые в это же время ходят на 2201.
      - "127.0.0.1:2203:22"
    # Ключи хоста генерируются при старте контейнера: тесты проверяют в том числе
    # поведение при первой встрече с незнакомым ключом, и для этого он должен быть новым.
    volumes:
      - ./.stand/authorized_keys:/keys/authorized_keys:ro

  # Сервер без подсистемы SFTP: проверяет запасной путь через SCP + ls.
  nosftp:
    build:
      context: .
      dockerfile: Dockerfile.nosftp
    ports:
      - "127.0.0.1:2204:22"
    volumes:
      - ./.stand/authorized_keys:/keys/authorized_keys:ro

  alpine:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    ports:
      - "127.0.0.1:2202:22"
    volumes:
      - ./.stand/authorized_keys:/keys/authorized_keys:ro
